<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="nav-container">
    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img
        src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=768,fit=crop,q=95/mnl9yn5qW9tMx4R0/jay-laser-final-logo-A85M6VMe61IrOeRb.jpg"
        alt="Jay Laser And Engineers"
        class="logo-img"
      />
    </a>

    <!-- Desktop Nav -->
    <nav class="nav-links" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="nav-link"
        >
          {{ link.label }}
        </a>
      }
      <a routerLink="/contact" class="btn-primary nav-cta">Get a Quote</a>
    </nav>

    <!-- Mobile Hamburger -->
    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
      <span [class.open]="menuOpen()"></span>
      <span [class.open]="menuOpen()"></span>
      <span [class.open]="menuOpen()"></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        class="mobile-link"
        (click)="closeMenu()"
      >
        {{ link.label }}
      </a>
    }
    <a routerLink="/contact" class="btn-primary mobile-cta" (click)="closeMenu()">Get a Quote</a>
  </div>
</header>
